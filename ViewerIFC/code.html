<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Plataforma BIM - Escada de Aço</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#17b0cf",
                        "primary-dark": "#128ca6",
                        "background-light": "#f7f7f8",
                        "background-dark": "#1a1a1a",
                        "surface-dark": "#111718",
                        "grid-line": "#e5e7eb",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "sans": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.125rem", "sm": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for technical look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc; 
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #aaa; 
        }

        /* Dotted background pattern for technical feel */
        .bg-tech-grid {
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* Blueprint grid */
        .bg-blueprint-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, #e5e7eb 1px, transparent 1px),
                              linear-gradient(to bottom, #e5e7eb 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-surface-dark font-display antialiased overflow-hidden h-screen flex flex-col">
<!-- Global Navigation Bar -->
<header class="h-14 bg-surface-dark text-white flex items-center justify-between px-4 border-b border-[#2a2f30] shrink-0 z-50">
<div class="flex items-center gap-4">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-[24px]">deployed_code</span>
</div>
<div class="h-6 w-px bg-white/20"></div>
<div>
<h1 class="text-sm font-bold tracking-wide uppercase leading-none">Escada de Aço Industrial</h1>
<span class="text-xs text-gray-400 font-sans">BIM Viewer • Projeto #ST-2024-X8</span>
</div>
</div>
<div class="flex items-center gap-6">
<!-- View Toggles -->
<div class="bg-white/10 p-1 rounded-sm flex items-center gap-1">
<button class="flex items-center gap-1.5 px-3 py-1 text-xs font-bold bg-transparent hover:bg-white/10 text-gray-300 rounded-sm transition-colors">
<span class="material-symbols-outlined text-[16px]">description</span>
                    2D
                </button>
<button class="flex items-center gap-1.5 px-3 py-1 text-xs font-bold bg-primary text-surface-dark rounded-sm shadow-sm">
<span class="material-symbols-outlined text-[16px]">splitscreen</span>
                    Split
                </button>
<button class="flex items-center gap-1.5 px-3 py-1 text-xs font-bold bg-transparent hover:bg-white/10 text-gray-300 rounded-sm transition-colors">
<span class="material-symbols-outlined text-[16px]">view_in_ar</span>
                    3D
                </button>
</div>
<div class="h-6 w-px bg-white/20"></div>
<!-- User/Settings -->
<div class="flex items-center gap-3">
<button class="text-gray-300 hover:text-white transition-colors">
<span class="material-symbols-outlined text-[20px]">notifications</span>
</button>
<button class="text-gray-300 hover:text-white transition-colors">
<span class="material-symbols-outlined text-[20px]">settings</span>
</button>
<div class="size-8 rounded bg-primary/20 flex items-center justify-center text-primary font-bold text-xs border border-primary/40">
                    JD
                </div>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex overflow-hidden relative">
<!-- Left Panel: 2D Viewer -->
<section class="w-1/2 flex flex-col border-r border-gray-200 bg-white relative group">
<!-- Toolbar Overlay -->
<div class="absolute top-4 left-4 z-10 flex flex-col gap-2 bg-white border border-gray-200 shadow-lg rounded-sm p-1.5">
<button class="p-2 hover:bg-gray-100 rounded-sm text-gray-600 transition-colors" title="Zoom In">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
<button class="p-2 hover:bg-gray-100 rounded-sm text-gray-600 transition-colors" title="Zoom Out">
<span class="material-symbols-outlined text-[20px]">remove</span>
</button>
<button class="p-2 bg-primary/10 text-primary rounded-sm transition-colors" title="Pan">
<span class="material-symbols-outlined text-[20px]">pan_tool</span>
</button>
<div class="h-px w-full bg-gray-200 my-1"></div>
<button class="p-2 hover:bg-gray-100 rounded-sm text-gray-600 transition-colors" title="Reset View">
<span class="material-symbols-outlined text-[20px]">center_focus_strong</span>
</button>
</div>
<!-- Sheet Info -->
<div class="absolute top-4 right-4 z-10 bg-white/90 backdrop-blur border border-gray-200 shadow-sm rounded-sm px-3 py-2 text-xs font-mono text-gray-500">
                S-101 • PLANTA BAIXA NÍVEL 1
            </div>
<!-- 2D Canvas / Drawing -->
<div class="flex-1 overflow-auto bg-blueprint-grid relative flex items-center justify-center cursor-grab active:cursor-grabbing p-10">
<!-- Simulated Technical Drawing Content -->
<div class="relative bg-white shadow-2xl w-[600px] h-[800px] border border-gray-300 p-8 select-none">
<!-- Drawing Header -->
<div class="absolute bottom-4 right-4 border-2 border-black p-2 w-48">
<div class="text-[8px] uppercase font-bold tracking-widest border-b border-black pb-1 mb-1">PLANN3D ENGINEERING</div>
<div class="text-[10px] font-bold">DETALHE ESTRUTURAL</div>
<div class="text-[8px] text-gray-500">ESCADA E-04</div>
</div>
<!-- SVG Representation of Blueprint -->
<svg class="w-full h-full stroke-black stroke-[1.5px] fill-none" viewbox="0 0 400 600">
<!-- Grid lines for context -->
<line class="stroke-gray-300 stroke-1" stroke-dasharray="5,5" x1="20" x2="20" y1="20" y2="580"></line>
<line class="stroke-gray-300 stroke-1" stroke-dasharray="5,5" x1="380" x2="380" y1="20" y2="580"></line>
<!-- Staircase Plan View -->
<rect class="stroke-2" height="300" width="200" x="100" y="100"></rect>
<!-- Steps -->
<line x1="100" x2="300" y1="130" y2="130"></line>
<line x1="100" x2="300" y1="160" y2="160"></line>
<line x1="100" x2="300" y1="190" y2="190"></line>
<line x1="100" x2="300" y1="220" y2="220"></line>
<!-- Landing -->
<rect fill="url(#hatch)" height="60" opacity="0.1" width="200" x="100" y="250"></rect>
<defs>
<pattern height="10" id="hatch" patterntransform="rotate(45)" patternunits="userSpaceOnUse" width="10">
<line stroke="#000" stroke-width="1" x1="0" x2="0" y="0" y2="10"></line>
</pattern>
</defs>
<line x1="100" x2="300" y1="310" y2="310"></line>
<line x1="100" x2="300" y1="340" y2="340"></line>
<line x1="100" x2="300" y1="370" y2="370"></line>
<!-- Section Marks -->
<!-- Section A-A -->
<g class="cursor-pointer hover:stroke-primary group/marker" onclick="alert('Navigating to Section A-A')">
<line class="stroke-black group-hover/marker:stroke-primary transition-colors" stroke-dasharray="10,5" x1="50" x2="350" y1="250" y2="250"></line>
<circle class="fill-white stroke-2 group-hover/marker:stroke-primary" cx="50" cy="250" r="8"></circle>
<text class="fill-black stroke-none group-hover/marker:fill-primary" font-family="sans-serif" font-size="8" text-anchor="middle" x="50" y="253">A</text>
<circle class="fill-white stroke-2 group-hover/marker:stroke-primary" cx="350" cy="250" r="8"></circle>
<text class="fill-black stroke-none group-hover/marker:fill-primary" font-family="sans-serif" font-size="8" text-anchor="middle" x="350" y="253">A</text>
</g>
<!-- Detail Callout -->
<g class="cursor-pointer hover:stroke-primary group/detail">
<circle class="stroke-primary stroke-2 fill-primary/5 animate-pulse" cx="300" cy="130" r="15" stroke-dasharray="2,2"></circle>
<line class="stroke-primary" x1="312" x2="340" y1="120" y2="100"></line>
<rect class="fill-white stroke-primary" height="20" width="40" x="340" y="90"></rect>
<text class="fill-primary stroke-none font-bold" font-size="8" text-anchor="middle" x="360" y="103">DET. 1</text>
</g>
<!-- Dimensions -->
<line class="stroke-gray-500 stroke-[0.5px]" x1="80" x2="80" y1="100" y2="400"></line>
<line class="stroke-gray-500 stroke-[0.5px]" x1="75" x2="85" y1="100" y2="100"></line>
<line class="stroke-gray-500 stroke-[0.5px]" x1="75" x2="85" y1="400" y2="400"></line>
<text class="fill-gray-600 stroke-none" font-size="10" text-anchor="middle" transform="rotate(-90, 70, 250)" x="70" y="250">4200</text>
</svg>
</div>
</div>
<!-- Contextual Sync Button -->
<div class="absolute bottom-6 left-1/2 -translate-x-1/2">
<button class="bg-surface-dark text-white px-4 py-2 rounded-full shadow-xl flex items-center gap-2 text-sm font-bold hover:bg-black transition-transform hover:-translate-y-1">
<span class="material-symbols-outlined text-[18px]">sync_alt</span>
                    Sincronizar Vistas
                </button>
</div>
</section>
<!-- Right Panel: 3D BIM Viewer -->
<section class="w-1/2 flex flex-col bg-[#f0f2f5] relative overflow-hidden">
<!-- 3D Viewport Background -->
<div class="absolute inset-0 z-0 bg-tech-grid opacity-30 pointer-events-none"></div>
<!-- 3D Render Placeholder -->
<div aria-label="3D Model Viewer showing steel staircase structure" class="flex-1 relative flex items-center justify-center perspective-1000 overflow-hidden" data-alt="Interactive 3D model of a steel industrial staircase with highlighted beams" role="img">
<!-- Mock 3D Elements using HTML/CSS transforms for visual representation -->
<div class="relative w-[400px] h-[500px] transform-style-3d rotate-x-6 rotate-y-12 rotate-z-2 scale-75 lg:scale-90 transition-transform duration-700 ease-out" style="transform: rotateX(60deg) rotateZ(-45deg);">
<!-- Floor Plane -->
<div class="absolute inset-0 bg-gray-300/50 border border-gray-400"></div>
<!-- Columns -->
<div class="absolute bottom-0 left-10 w-4 h-64 bg-gray-700 transform -translate-y-1/2 translate-z-32 shadow-xl"></div>
<div class="absolute bottom-0 right-10 w-4 h-64 bg-gray-700 transform -translate-y-1/2 translate-z-32 shadow-xl"></div>
<!-- Beams (Highlighted Selection) -->
<div class="absolute top-1/2 left-0 right-0 h-4 bg-primary shadow-[0_0_15px_rgba(23,176,207,0.6)] z-10 opacity-90 border border-white/30 transform translate-z-40 flex items-center justify-center">
<span class="text-[8px] text-white font-mono bg-black/50 px-1">BEAM-B02 Selected</span>
</div>
<!-- Stairs treads simulation -->
<div class="absolute bottom-10 left-10 w-40 h-8 bg-gray-600 transform translate-z-10 translate-x-10 translate-y-10 shadow-lg"></div>
<div class="absolute bottom-10 left-10 w-40 h-8 bg-gray-600 transform translate-z-20 translate-x-10 translate-y-20 shadow-lg"></div>
<div class="absolute bottom-10 left-10 w-40 h-8 bg-gray-600 transform translate-z-30 translate-x-10 translate-y-30 shadow-lg"></div>
<!-- Landing -->
<div class="absolute top-10 right-10 w-32 h-32 bg-gray-400/80 border border-gray-500 transform translate-z-40"></div>
</div>
<!-- Cube Navigation Widget -->
<div class="absolute top-4 right-4 size-16 bg-white/10 backdrop-blur border border-gray-300 rounded-sm flex items-center justify-center shadow-lg cursor-pointer hover:bg-white/20 transition-all">
<div class="size-8 border-2 border-gray-600 transform rotate-45 flex items-center justify-center">
<span class="text-[8px] font-bold text-gray-700 transform -rotate-45">TOP</span>
</div>
</div>
</div>
<!-- Bottom Floating Controls (3D) -->
<div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-surface-dark/95 backdrop-blur text-gray-200 rounded-sm px-2 py-1.5 flex gap-2 shadow-2xl z-20">
<button class="p-2 hover:bg-white/10 rounded-sm flex flex-col items-center gap-0.5 group" title="Orbit">
<span class="material-symbols-outlined text-[20px] group-hover:text-primary transition-colors">3d_rotation</span>
<span class="text-[9px] uppercase font-bold tracking-wider">Orbit</span>
</button>
<div class="w-px bg-white/10 my-1"></div>
<button class="p-2 hover:bg-white/10 rounded-sm flex flex-col items-center gap-0.5 group" title="Pan">
<span class="material-symbols-outlined text-[20px] group-hover:text-primary transition-colors">drag_pan</span>
<span class="text-[9px] uppercase font-bold tracking-wider">Pan</span>
</button>
<div class="w-px bg-white/10 my-1"></div>
<button class="p-2 bg-primary text-surface-dark rounded-sm flex flex-col items-center gap-0.5 shadow-glow" title="Section Box">
<span class="material-symbols-outlined text-[20px]">content_cut</span>
<span class="text-[9px] uppercase font-bold tracking-wider">Cut</span>
</button>
<div class="w-px bg-white/10 my-1"></div>
<button class="p-2 hover:bg-white/10 rounded-sm flex flex-col items-center gap-0.5 group" title="Explode">
<span class="material-symbols-outlined text-[20px] group-hover:text-primary transition-colors">open_in_full</span>
<span class="text-[9px] uppercase font-bold tracking-wider">Expl</span>
</button>
</div>
<!-- Properties Sidebar (Collapsed/Floating) -->
<div class="absolute top-20 right-4 w-64 bg-white/95 backdrop-blur border border-gray-200 shadow-xl rounded-sm p-3 z-10">
<div class="flex items-center justify-between mb-2">
<h3 class="text-xs font-bold uppercase text-gray-500">Propriedades</h3>
<button class="text-gray-400 hover:text-gray-600"><span class="material-symbols-outlined text-[16px]">close</span></button>
</div>
<div class="space-y-2">
<div class="p-2 bg-gray-50 rounded-sm border border-gray-100">
<div class="text-[10px] text-gray-400 uppercase">Elemento</div>
<div class="text-sm font-bold text-surface-dark">Viga Metálica IPE-200</div>
</div>
<div class="grid grid-cols-2 gap-2">
<div class="p-2 bg-gray-50 rounded-sm border border-gray-100">
<div class="text-[10px] text-gray-400 uppercase">Comprimento</div>
<div class="text-xs font-mono font-medium">4200 mm</div>
</div>
<div class="p-2 bg-gray-50 rounded-sm border border-gray-100">
<div class="text-[10px] text-gray-400 uppercase">Peso</div>
<div class="text-xs font-mono font-medium">84.5 kg</div>
</div>
</div>
<button class="w-full text-center text-xs text-primary font-bold hover:underline py-1">Ver todos os atributos</button>
</div>
</div>
</section>
</main>
<!-- Footer / Control Dock -->
<footer class="h-16 bg-white border-t border-gray-200 shrink-0 flex items-center justify-between px-6 shadow-[-10px_0_30px_rgba(0,0,0,0.05)] z-40 relative">
<!-- Preset Views -->
<div class="flex items-center gap-2">
<span class="text-[10px] uppercase font-bold text-gray-400 mr-2 tracking-widest">Vistas Predefinidas</span>
<button class="h-9 px-4 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded-sm text-xs font-bold text-surface-dark flex items-center gap-2 transition-colors">
<span class="material-symbols-outlined text-[16px]">grid_view</span>
                Planta
            </button>
<button class="h-9 px-4 bg-primary text-surface-dark border border-primary-dark rounded-sm text-xs font-bold flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined text-[16px]">arrow_right_alt</span>
                Corte A-A
            </button>
<button class="h-9 px-4 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded-sm text-xs font-bold text-surface-dark flex items-center gap-2 transition-colors">
<span class="material-symbols-outlined text-[16px]">arrow_upward</span>
                Corte B-B
            </button>
<button class="h-9 px-4 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded-sm text-xs font-bold text-surface-dark flex items-center gap-2 transition-colors">
<span class="material-symbols-outlined text-[16px]">view_in_ar</span>
                Isométrica
            </button>
</div>
<!-- Layer Filters -->
<div class="flex items-center gap-4 border-l border-gray-200 pl-6 h-10">
<span class="text-[10px] uppercase font-bold text-gray-400 tracking-widest">Filtros</span>
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center">
<input checked="" class="peer size-4 appearance-none rounded-sm border border-gray-300 checked:bg-surface-dark checked:border-surface-dark transition-all" type="checkbox"/>
<span class="absolute inset-0 flex items-center justify-center text-white opacity-0 peer-checked:opacity-100 pointer-events-none material-symbols-outlined text-[14px]">check</span>
</div>
<span class="text-xs font-medium text-gray-600 group-hover:text-surface-dark">Estrutura</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center">
<input checked="" class="peer size-4 appearance-none rounded-sm border border-gray-300 checked:bg-surface-dark checked:border-surface-dark transition-all" type="checkbox"/>
<span class="absolute inset-0 flex items-center justify-center text-white opacity-0 peer-checked:opacity-100 pointer-events-none material-symbols-outlined text-[14px]">check</span>
</div>
<span class="text-xs font-medium text-gray-600 group-hover:text-surface-dark">Degraus</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center">
<input class="peer size-4 appearance-none rounded-sm border border-gray-300 checked:bg-surface-dark checked:border-surface-dark transition-all" type="checkbox"/>
<span class="absolute inset-0 flex items-center justify-center text-white opacity-0 peer-checked:opacity-100 pointer-events-none material-symbols-outlined text-[14px]">check</span>
</div>
<span class="text-xs font-medium text-gray-600 group-hover:text-surface-dark">Guarda-corpos</span>
</label>
</div>
</footer>
</body></html>
